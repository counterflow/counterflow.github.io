<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract terminal multiplexer: tiled panes with one lit, driven by lines from a single point">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2029" stroke-width="1"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1318"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>

  <!-- control lines from a single driving point into every pane -->
  <g fill="none" stroke="#e8a33d" stroke-width="1.5" opacity="0.5">
    <path d="M186 470 C 250 470, 250 480, 300 480"/>
    <path d="M186 470 C 480 470, 540 340, 760 340"/>
    <path d="M186 470 C 480 470, 560 610, 760 610"/>
    <path d="M186 470 C 620 470, 700 620, 965 620"/>
  </g>
  <circle cx="186" cy="470" r="9" fill="#e8a33d" filter="url(#softglow)"/>
  <circle cx="186" cy="470" r="22" fill="none" stroke="#e8a33d" stroke-width="1.2" opacity="0.45"/>

  <!-- dim panes -->
  <g stroke="#33404f" stroke-width="1.6" fill="#161b22">
    <rect x="760" y="220" width="390" height="240" rx="6"/>
    <rect x="760" y="480" width="185" height="260" rx="6"/>
    <rect x="965" y="480" width="185" height="260" rx="6"/>
  </g>
  <g fill="#2c3846">
    <rect x="790" y="258" width="210" height="7" rx="3.5"/>
    <rect x="790" y="278" width="150" height="7" rx="3.5"/>
    <rect x="790" y="298" width="248" height="7" rx="3.5"/>
    <rect x="790" y="318" width="120" height="7" rx="3.5"/>
    <rect x="788" y="518" width="118" height="6" rx="3"/>
    <rect x="788" y="536" width="86" height="6" rx="3"/>
    <rect x="788" y="554" width="132" height="6" rx="3"/>
    <rect x="993" y="518" width="132" height="6" rx="3"/>
    <rect x="993" y="536" width="94" height="6" rx="3"/>
    <rect x="993" y="554" width="118" height="6" rx="3"/>
  </g>

  <!-- the live pane -->
  <g filter="url(#glow)">
    <rect x="300" y="220" width="440" height="520" rx="7" fill="#1b222b" stroke="#e8a33d" stroke-width="2.2"/>
  </g>
  <rect x="300" y="220" width="440" height="46" rx="7" fill="#e8a33d" opacity="0.12"/>
  <line x1="300" y1="266" x2="740" y2="266" stroke="#e8a33d" stroke-width="1.4" opacity="0.55"/>
  <g fill="#e8a33d">
    <rect x="332" y="308" width="264" height="8" rx="4" opacity="0.85"/>
    <rect x="332" y="336" width="180" height="8" rx="4" opacity="0.6"/>
    <rect x="332" y="364" width="330" height="8" rx="4" opacity="0.72"/>
    <rect x="332" y="392" width="212" height="8" rx="4" opacity="0.5"/>
    <rect x="332" y="420" width="288" height="8" rx="4" opacity="0.66"/>
    <rect x="332" y="448" width="146" height="8" rx="4" opacity="0.42"/>
    <rect x="332" y="476" width="252" height="8" rx="4" opacity="0.55"/>
    <rect x="332" y="504" width="196" height="8" rx="4" opacity="0.38"/>
    <rect x="332" y="532" width="308" height="8" rx="4" opacity="0.48"/>
    <rect x="332" y="560" width="164" height="8" rx="4" opacity="0.32"/>
    <rect x="332" y="588" width="228" height="8" rx="4" opacity="0.4"/>
    <rect x="332" y="616" width="132" height="8" rx="4" opacity="0.26"/>
  </g>
  <rect x="332" y="644" width="20" height="14" rx="2" fill="#e8a33d" filter="url(#softglow)"/>
</svg>
